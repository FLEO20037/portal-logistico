databases:
  - name: portal-logistico-db
    plan: free
    databaseName: portal_logistico
    user: portal_logistico

services:
  - type: web
    name: portal-logistico-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portal-logistico-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://portal-logistico-frontend.onrender.com

  - type: web
    name: portal-logistico-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://portal-logistico-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
